name: Source and secret checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check tracked files
        run: python scripts/check_publication.py
      - name: Install and verify Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan complete public history
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --config .gitleaks.toml --redact --no-banner --ignore-gitleaks-allow .'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check src tests scripts

  container-isolation:
    name: Docker parser isolation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build bot and isolated parser images
        run: |
          cp .env.example .env
          docker compose -p seminar-ci build seminar-bot document-parser
      - name: Start only the isolated parser
        run: docker compose -p seminar-ci up -d --no-deps document-parser
      - name: Verify container isolation and blocked Internet access
        run: python3 scripts/container_check.py inspect --project seminar-ci
      - name: Parse a real PDF from the bot image without starting Discord
        run: |
          docker compose -p seminar-ci run --rm --no-deps -T \
            --volume "$PWD/scripts/container_check.py:/tmp/container_check.py:ro" \
            seminar-bot python /tmp/container_check.py client
      - name: Remove ephemeral CI containers and volumes
        if: always()
        run: docker compose -p seminar-ci down --volumes --remove-orphans
